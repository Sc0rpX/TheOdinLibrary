<body>
    <div class="header">
        <div class="logo_wrapper">
            <img src="images/bookshelf.svg" alt="Bookshelf icon">
            <p>The Odin Library</p>
        </div>
        <button id="add_book_btn">
            <img src="images/plus-box.svg" alt="">
            Add Book
        </button>
    </div>
    <div class="books_container">

            <div class="book_cover">

    </div>
    <div class="footer">
        <p class="footer_text">&copy The Odin Library 2026</p>
    </div>

    <!-- Add book dialog box -->
     <dialog id="add_book_dialog">
        <form method="dialog" id="add_book_form">
            <h2>Add book</h2>

            <label>
                <span>Title:</span>
                <input type="text" id="book_title_input" required>
            </label>
            <label>
                <span>Author:</span>
                <input type="text" id="book_author_input" required>
            </label>
            <label>
                <span>Number of page:</span>
                <input type="number" id="book_page_number_input" required>
            </label>
            <label>
                <span>Book Cover URL:</span>
                <input type="text" id="book_cover_url" required>
            </label>
            <label id="read_status_label">
                Did you read this? 
                <select name="read_status" id="read_status" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </label>
            <div class="action_buttons">
                <button id="confirm_btn" value="default">Confirm</button>
                <button id="cancel_btn" value="cancel" formnovalidate>Cancel</button>
            </div>
        </form>
     </dialog>
</body>
