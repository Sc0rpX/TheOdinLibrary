<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Odin Library</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- Roboto Google Font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="logo_wrapper">
            <img src="images/bookshelf.svg" alt="Bookshelf icon">
            <p>The Odin Library</p>
        </div>
        <div class="button">
            <img src="images/plus-box.svg" alt="">
            <p>Add Book</p>
        </div>
    </div>
    <div class="books_container">
        <div class="card">
            <div class="book_cover"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoVDjVRUD6MTv7zgbWWyX9tSONpR2ttgXBww&s" alt="Books cover"></div>
            <div class="book_info">
                <h2 class="book_title">The Psychology Of Money</h2>
                <p class="book_author">Morgan Housel</p>
                <p class="book_pages">Pages 69</p>
            </div>
            <div class="action_buttons">
                <div class="button">Read</div>
                <div class="button" id="remove_button">
                    <img src="images/delete.svg" alt="delete icon">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="book_cover"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoVDjVRUD6MTv7zgbWWyX9tSONpR2ttgXBww&s" alt="Books cover"></div>
            <div class="book_info">
                <h2 class="book_title">The Psychology Of Money</h2>
                <p class="book_author">Morgan Housel</p>
                <p class="book_pages">Pages 69</p>
            </div>
            <div class="action_buttons">
                <div class="button">Read</div>
                <div class="button" id="remove_button">
                    <img src="images/delete.svg" alt="delete icon">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="book_cover"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoVDjVRUD6MTv7zgbWWyX9tSONpR2ttgXBww&s" alt="Books cover"></div>
            <div class="book_info">
                <h2 class="book_title">The Psychology Of Money</h2>
                <p class="book_author">Morgan Housel</p>
                <p class="book_pages">Pages 69</p>
            </div>
            <div class="action_buttons">
                <div class="button">Read</div>
                <div class="button" id="remove_button">
                    <img src="images/delete.svg" alt="delete icon">
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <p class="footer_text">&copy The Odin Library 2026</p>
    </div>
</body>
</html>
